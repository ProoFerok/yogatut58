name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ProoFerok/yogatut58'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # lastmod в sitemap.xml = дата коммита, который деплоится
      - name: Update sitemap lastmod
        run: |
          d=$(git log -1 --format=%cs)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$d</lastmod>|" sitemap.xml
          cat sitemap.xml
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сообщаем Яндексу об обновлении через IndexNow (ключ лежит в корне сайта)
  indexnow:
    needs: deploy
    if: github.repository == 'ProoFerok/yogatut58'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: 93e3dcb603ba7f6a827a7477528c7ec0
    steps:
      - name: Ping IndexNow (Yandex)
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST 'https://yandex.com/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"yogatut58.ru\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://yogatut58.ru/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://yogatut58.ru/\"]}")
          echo "HTTP $code"; cat /tmp/resp.txt; echo
          case "$code" in 200|202) ;; *) exit 1 ;; esac
